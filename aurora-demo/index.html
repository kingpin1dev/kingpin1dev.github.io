    <script>
      // kingpindev.com demo: stand in for the WPF host so the desktop title bar shows.
      // Window buttons do nothing; "open" links go to a new tab.
      window.chrome = window.chrome || {};
      window.chrome.webview = {
        postMessage(m) { try { const d = JSON.parse(m); if (d.type === 'open') window.open(d.url, '_blank', 'noopener'); } catch (e) {} },
        addEventListener() {}, removeEventListener() {},
      };
      // Start on a mood so the first view has stations, like a returning user.
      addEventListener('load', () => {
        let n = 0;
        const t = setInterval(() => {
          const b = [...document.querySelectorAll('button')].find((x) => x.textContent.trim() === 'Chill');
          if (b || ++n > 50) { clearInterval(t); if (b) b.click(); }
        }, 100);
      });
    </script>
