    />
    <title>SpotiDrop</title>
    <meta name="robots" content="noindex" />
    <script src="/frame-bridge.js"></script>
    <script src="./mock.js"></script>
    <script>
      // kingpindev.com demo: open on the Spotify tab with a made-up album already read, like a returning user.
      addEventListener('load', () => {
        const find = (sel, txt) => [...document.querySelectorAll(sel)].find((x) => x.textContent.trim().toLowerCase() === txt.toLowerCase());
        let n = 0;
        const t = setInterval(() => {
          const tab = find('button', 'Spotify');
          if (tab || ++n > 60) { clearInterval(t); if (tab) go(tab); }
        }, 100);
        function go(tab) {
          tab.click();
          setTimeout(() => {
            const input = document.querySelector('input[placeholder*="open.spotify"]');
            if (!input) return;
            const set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
            set.call(input, 'https://open.spotify.com/album/5kNeonCoastDemo');
            input.dispatchEvent(new Event('input', { bubbles: true }));
            setTimeout(() => { const r = find('button', 'Read'); if (r) r.click(); setTimeout(() => { const d = [...document.querySelectorAll('button')].filter((x) => x.textContent.trim().toLowerCase() === 'download')[1]; if (d) d.click(); }, 1800); }, 150);
          }, 400);
        }
      });
    </script>
