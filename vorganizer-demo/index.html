<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vOrganizer</title>
  <script src="/frame-bridge.js"></script>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f2f2f7" id="metaThemeColor" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Titlebar ── -->
    <header class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <span class="app-icon">🗂️</span>
        <div class="app-meta">
          <span class="app-name">vOrganizer</span>
          <span class="app-sub">Automatically sort files into organized folders</span>
        </div>
      </div>
      <div class="titlebar-right">
        <button class="btn btn-ghost btn-sm install-btn" id="installBtn" hidden
                title="Install as desktop app — removes the title bar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M10 3v10M6 9l4 4 4-4M3 15h14"/>
          </svg>
          Install App
        </button>
        <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
          <span class="theme-icon" id="themeIcon">🌙</span>
          <span class="theme-label" id="themeLabel">Dark</span>
        </button>
      </div>
    </header>

    <!-- ── Scrollable content ── -->
    <main class="content">

      <!-- Folder card -->
      <section class="card" id="folderCard">
        <div class="card-header">
          <h2 class="section-title">Select Folder</h2>
        </div>

        <div class="shortcut-row">
          <button class="shortcut-btn" data-name="Downloads">
            <span class="shortcut-icon">📥</span>
            <span>Downloads</span>
          </button>
          <button class="shortcut-btn" data-name="Desktop">
            <span class="shortcut-icon">🖥️</span>
            <span>Desktop</span>
          </button>
          <button class="shortcut-btn" data-name="Documents">
            <span class="shortcut-icon">📁</span>
            <span>Documents</span>
          </button>
          <button class="shortcut-btn" id="browseBtn">
            <span class="shortcut-icon">📂</span>
            <span>Custom…</span>
          </button>
        </div>

        <div class="folder-display" id="folderDisplay">
          <span class="fd-icon">📁</span>
          <span class="fd-path" id="fdPath">No folder selected</span>
          <button class="fd-open" id="fdOpen" title="Open in Explorer" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3M9 2h5v5M14 2 8 8"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Categories card -->
      <section class="card" id="categoriesCard">
        <div class="card-header">
          <h2 class="section-title">File Categories</h2>
          <label class="check-label" id="selectAllLabel">
            <input type="checkbox" id="selectAll" checked />
            <span class="check-box"></span>
            <span>Select All</span>
          </label>
        </div>

        <div class="cat-grid" id="catGrid">
          <!-- Populated by app.js -->
        </div>

        <div class="action-row">
          <button class="btn btn-ghost" id="previewBtn">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="10" cy="10" rx="9" ry="6"/><circle cx="10" cy="10" r="3"/></svg>
            Preview
          </button>
          <button class="btn btn-primary" id="organizeBtn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a.75.75 0 0 1 .53.22l3.5 3.5a.75.75 0 1 1-1.06 1.06L11 4.81V13a1 1 0 0 1-2 0V4.81L7.03 6.78A.75.75 0 0 1 5.97 5.72l3.5-3.5A.75.75 0 0 1 10 2ZM3 13a1 1 0 0 1 2 0v2h10v-2a1 1 0 0 1 2 0v2.5A1.5 1.5 0 0 1 15.5 17h-11A1.5 1.5 0 0 1 3 15.5V13Z"/></svg>
            Organize Now
          </button>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-label" id="progressLabel">Starting…</span>
        </div>
      </section>

      <!-- Log card -->
      <section class="card log-card" id="logCard">
        <div class="card-header">
          <h2 class="section-title">Activity Log</h2>
          <div class="log-btns">
            <button class="btn btn-ghost btn-sm" id="undoBtn" disabled>
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h9a5 5 0 0 1 0 10H6M3 8l4-4M3 8l4 4"/></svg>
              Undo
            </button>
            <button class="btn btn-ghost btn-sm" id="clearBtn">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h8M8 4V3h4v1M4 7h12l-1 10H5L4 7Z"/></svg>
              Clear
            </button>
          </div>
        </div>

        <div class="log-body" id="logBody"></div>
      </section>

    </main>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
