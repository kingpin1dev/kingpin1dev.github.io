  <style>
    :root {
      --bg: #030712; --ink: #f8fbff; --soft: #dbe8ff; --muted: #93a4bd; --faint: #56657b;
      --cyan: #42f8ff; --violet: #9c7cff; --pink: #ff65d8; --green: #70ffb2; --amber: #ffc96d; --red: #ff6b8f;
      --glass: rgba(255,255,255,.055); --stroke: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
      font: 16px/1.55 "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: -20vh -10vw auto; height: 90vh; z-index: -1; pointer-events: none;
      background: radial-gradient(40% 50% at 20% 30%, rgba(156,124,255,.22), transparent 70%),
                  radial-gradient(35% 45% at 80% 20%, rgba(66,248,255,.14), transparent 70%),
                  radial-gradient(30% 40% at 60% 70%, rgba(255,101,216,.10), transparent 70%);
    }
    a { color: var(--cyan); }
    .shell { width: min(1080px, 100% - 32px); margin: 0 auto; }

    header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 800; }
    .brand img { width: 36px; height: 36px; border-radius: 11px; }
    .brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }
    .top-r { display: flex; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 38px; padding: 0 14px;
      border-radius: 999px; border: 1px solid var(--stroke); background: var(--glass); color: var(--soft);
      text-decoration: none; font-weight: 700; font-size: 13.5px;
    }
    .chip:hover { border-color: rgba(66,248,255,.45); }

    .hero { padding: 34px 0 10px; text-align: center; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--amber); border: 1px solid rgba(255,201,109,.35); background: rgba(255,201,109,.08);
    }
    .kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.04; letter-spacing: -.035em; margin: 18px 0 12px; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: 17px; }

    .banner {
      margin: 26px auto 0; max-width: 720px; padding: 14px 18px; border-radius: 16px; display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid rgba(112,255,178,.35); background: rgba(112,255,178,.08); color: #d6ffe9; text-align: left;
    }
    .banner.warn { border-color: rgba(255,201,109,.35); background: rgba(255,201,109,.08); color: #ffeccc; }
    .banner b { display: block; }

    main { padding: 30px 0 40px; }
    .gw {
      position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; margin-bottom: 18px;
    }
    .gw::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
      background: radial-gradient(60% 80% at 0% 0%, color-mix(in srgb, var(--c, #9c7cff) 30%, transparent), transparent 70%);
    }
    .gw-l, .gw-r { position: relative; padding: 30px; }
    .gw-r { border-left: 1px solid var(--stroke); background: rgba(3,7,18,.35); }
    .gw-app { display: flex; align-items: center; gap: 16px; }
    .gw-app img { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .gw-app .state { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--green); display: inline-flex; align-items: center; gap: 7px; }
    .gw-app .state i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1.6s ease-in-out infinite; }
    .gw-app .state.soon { color: var(--cyan); }
    @keyframes pulse { 50% { opacity: .35; } }
    .gw-app h2 { margin: 2px 0 0; font-size: 30px; letter-spacing: -.02em; }
    .prize { margin: 22px 0 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .prize b { font-size: 40px; line-height: 1; font-weight: 900; color: var(--amber); }
    .prize span { color: var(--soft); font-weight: 600; font-size: 17px; }
    .note { color: var(--muted); margin: 14px 0 0; white-space: pre-line; }
    .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 14px; }
    .meta b { color: var(--ink); }
    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

    .count-label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 24px; }
    .count div { border-radius: 16px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); padding: 12px 6px; text-align: center; }
    .count b { display: block; font: 800 30px/1.1 "Fira Code", monospace; font-variant-numeric: tabular-nums; }
    .count span { font-size: 11.5px; color: var(--muted); }

    form.enter label { display: block; font-weight: 700; margin-bottom: 8px; }
    .field { display: flex; gap: 8px; }
    .field input {
      flex: 1; min-width: 0; height: 52px; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(3,7,18,.7);
      color: var(--ink); padding: 0 16px; font: inherit;
    }
    .field input:focus { outline: none; border-color: rgba(66,248,255,.6); box-shadow: 0 0 0 4px rgba(66,248,255,.12); }
    .btn {
      height: 52px; padding: 0 22px; border: 0; border-radius: 14px; cursor: pointer; font: 800 15px "Fira Sans", sans-serif; color: #071021;
      background: linear-gradient(135deg, var(--cyan), var(--violet)); box-shadow: 0 10px 30px rgba(156,124,255,.3); white-space: nowrap;
    }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .fine { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
    .spam-note {
      display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 11px 13px; border-radius: 12px; font-size: 13.5px;
      color: #ffeccc; border: 1px solid rgba(255,201,109,.35); background: rgba(255,201,109,.08);
    }
    .spam-note b { color: var(--amber); }
    .result { margin-top: 14px; padding: 13px 15px; border-radius: 14px; font-size: 14.5px; display: none; }
    .result.ok { display: block; border: 1px solid rgba(112,255,178,.35); background: rgba(112,255,178,.08); color: #d6ffe9; }
    .result.err { display: block; border: 1px solid rgba(255,107,143,.4); background: rgba(255,107,143,.08); color: #ffd6e0; }

    .empty {
      text-align: center; padding: 50px 24px; border-radius: 28px; border: 1px dashed var(--stroke); background: rgba(255,255,255,.025);
    }
    .empty .ico { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: rgba(156,124,255,.12); border: 1px solid rgba(156,124,255,.35); font-size: 30px; }
    .empty h2 { margin: 0 0 8px; font-size: 26px; }
    .empty p { color: var(--muted); margin: 0 auto; max-width: 520px; }
    .empty .links { justify-content: center; }

    .section-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
    .recent { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--stroke); background: var(--glass); margin-bottom: 10px; }
    .recent img { width: 44px; height: 44px; border-radius: 13px; }
    .recent span { color: var(--muted); font-size: 14px; }

    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .step { padding: 20px; border-radius: 20px; border: 1px solid var(--stroke); background: var(--glass); }
    .step b { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; margin-bottom: 10px; background: rgba(66,248,255,.1); color: var(--cyan); }
    .step h3 { margin: 0 0 6px; font-size: 17px; }
    .step p { margin: 0; color: var(--muted); font-size: 14.5px; }
    details { margin-top: 12px; border-radius: 18px; border: 1px solid var(--stroke); background: var(--glass); padding: 16px 20px; }
    summary { cursor: pointer; font-weight: 700; }
    details ul { color: var(--muted); margin: 12px 0 0; padding-left: 20px; }
    details li + li { margin-top: 6px; }

    footer { padding: 30px 0 40px; color: var(--faint); font-size: 13.5px; text-align: center; }
    footer a { color: var(--muted); }
    .skeleton { height: 340px; border-radius: 28px; border: 1px solid var(--stroke); background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }

    @media (max-width: 820px) {
      .gw { grid-template-columns: 1fr; }
      .gw-r { border-left: 0; border-top: 1px solid var(--stroke); }
      .gw-l, .gw-r { padding: 22px; }
      .steps { grid-template-columns: 1fr; }
      .field { flex-direction: column; }
      .btn { width: 100%; }
      .count b { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body data-i18n-skip>
  <!-- Public giveaway page. Data and entries go through the kingpindev-admin service on the server
       (/api/giveaway, /giveaway/confirm/<token>, /giveaway/leave/<token>); the admin side is admin.kingpindev.com.
       Text is in the T table below, picked by window.KPD_LANG from i18n.js. -->
  <div class="shell">

      <a class="brand" href="/"><img src="/img/websitesfavicon.png" alt=""><span>Kingpindev<small data-t="brandSub"></small></span></a>

    <main>

      <div class="section-title" data-t="howTitle"></div>

    <footer><span>© 2026 Kingpindev · </span><a href="/" data-t="home"></a> · <a href="mailto:admin@kingpindev.com">admin@kingpindev.com</a></footer>
  </div>

  (function () {

    const T = {

        live: 'Devam ediyor', soon: 'Yakında başlıyor', winners: n => n + ' kazanan', entries: n => '<b>' + n + '</b> katılımcı',
        endsAt: d => 'Bitiş: <b>' + d + '</b>', startsAt: d => 'Başlangıç: <b>' + d + '</b>',
        countEnd: 'Bitmesine kalan', countStart: 'Başlamasına kalan', d: 'gün', h: 'saat', m: 'dakika', s: 'saniye',
        email: 'E-posta adresin', join: 'Katıl', sending: 'Gönderiliyor…',
        fine: 'Katılım ücretsiz, kişi başı bir hak. E-postan yalnızca bu çekiliş için kullanılır ve çekilişten 30 gün sonra silinir.',
        sent: e => '<b>Neredeyse tamam!</b> ' + e + ' adresine bir onay maili gönderdik. Linke tıklayınca çekilişe girmiş olursun.',
        spamNote: 'Gelen kutunda yoksa Spam’e bak ve “Spam değil” olarak işaretle, sonraki çekilişlerin mailleri doğrudan gelsin.',
        already: '<b>Zaten katıldın.</b> Bu e-posta adresi çekilişte, sonucu mailine göndereceğiz.',
        invalid: 'Bu e-posta adresi geçerli görünmüyor.', closed: 'Bu çekiliş artık katılıma kapalı.',
        slow: 'Biraz hızlı oldu, birkaç saniye sonra tekrar dene.', limit: 'Çok fazla deneme yapıldı, biraz sonra tekrar dene.', fail: 'Bir sorun oldu, biraz sonra tekrar dene.',
        store: 'Store’da gör', site: 'Uygulama sayfası',
        emptyT: 'Şu anda aktif giveaway yok', emptyP: 'Yeni çekilişleri ilk duyanlardan olmak için Discord’a katıl ya da Instagram’dan takip et.',
        upcomingT: 'Yaklaşan çekiliş', recentT: 'Son çekilişler', recentLine: (n, d) => n + ' kazanan belirlendi · ' + d + ' · kodlar e-postayla gönderildi',
        drawing: 'Çekiliş yapılıyor…',
        confirmed: '<b>Katılımın onaylandı!</b> Çekilişe girdin. Kazanırsan kodun mailine gelecek, bol şans!',
        left: '<b>Katılımın silindi.</b> E-posta adresin çekilişten çıkarıldı.',
        badLink: '<b>Bu bağlantı geçersiz.</b> Daha önce kullanılmış ya da katılım silinmiş olabilir.',
        closedLink: '<b>Çekiliş sona erdi.</b> Onay bağlantısı çekiliş bitmeden kullanılmalıydı.',
        howTitle: 'Nasıl çalışır?',
        s1h: 'E-postanı yaz', s1p: 'Aktif çekilişe e-posta adresinle katıl. Kayıt ya da hesap gerekmez.',
        s2h: 'Onayla', s2p: 'Gelen maildeki bağlantıya tıkla (mail Spam klasörüne düşmüş olabilir). Onaylanmayan katılımlar çekilişe girmez.',
        s3h: 'Kazan', s3p: 'Süre bitince kazananlar rastgele seçilir ve kodları otomatik olarak mailine gönderilir.',
        rulesTitle: 'Kurallar ve gizlilik',
        rules: ['Her kişi bir çekilişe bir kez katılabilir. Aynı kişinin birden çok adresle katıldığı anlaşılırsa katılımları geçersiz sayılır.',
                'Kazananlar süre bitiminde, onaylanmış katılımlar arasından rastgele seçilir.',
                'Ödül Microsoft Store kodu olarak e-postayla gönderilir; para ya da başka bir ödülle değiştirilemez.',
                'E-posta adresin yalnızca bu çekiliş için kullanılır, kimseyle paylaşılmaz, reklam için kullanılmaz ve çekilişten 30 gün sonra silinir.',
                'Katılımını iptal etmek için onay mailindeki “katılımı iptal et” bağlantısını kullanabilirsin.',
                'Sorular için: admin@kingpindev.com'],
        months: ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık']
      },
      en: {
        brandSub: 'Giveaways', home: 'Home',
        title: 'Win my <em>apps</em>.', lead: 'Regular giveaways for Kingpindev apps. Enter with your email, and if you win, your Microsoft Store code lands straight in your inbox.',
        live: 'Live now', soon: 'Starting soon', winners: n => n + (n === 1 ? ' winner' : ' winners'), entries: n => '<b>' + n + '</b> ' + (n === 1 ? 'entry' : 'entries'),
        endsAt: d => 'Ends: <b>' + d + '</b>', startsAt: d => 'Starts: <b>' + d + '</b>',
        countEnd: 'Ends in', countStart: 'Starts in', d: 'days', h: 'hours', m: 'minutes', s: 'seconds',
        email: 'Your email address', join: 'Enter', sending: 'Sending…',
        fine: 'Free to enter, one entry per person. Your email is only used for this giveaway and is deleted 30 days after the draw.',
        sent: e => '<b>Almost done!</b> We sent a confirmation email to ' + e + '. Click the link in it to enter.',
        spamNote: 'Not in your inbox? Check Spam and mark it “Not spam”, so emails from future giveaways reach you directly.',
        already: '<b>You’re already in.</b> This email is entered, and we’ll email you the result.',
        invalid: 'That email address doesn’t look right.', closed: 'This giveaway is closed.',
        slow: 'That was a bit quick, try again in a few seconds.', limit: 'Too many attempts, please try again later.', fail: 'Something went wrong, please try again later.',
        store: 'View on Store', site: 'App page',
        emptyT: 'There’s no active giveaway right now', emptyP: 'Join the Discord or follow on Instagram to hear about the next one first.',
        upcomingT: 'Coming up', recentT: 'Recent giveaways', recentLine: (n, d) => (n === 1 ? '1 winner' : n + ' winners') + ' drawn · ' + d + ' · codes sent by email',
        drawing: 'Drawing winners…',
        confirmed: '<b>Your entry is confirmed!</b> You’re in. If you win, your code will arrive by email. Good luck!',
        left: '<b>Your entry was removed.</b> Your email has been taken out of the giveaway.',
        badLink: '<b>This link is no longer valid.</b> It may have been used already, or the entry was removed.',
        closedLink: '<b>The giveaway has ended.</b> The confirmation link had to be used before the end.',
        howTitle: 'How it works',
        s1h: 'Enter your email', s1p: 'Join the active giveaway with your email address. No account or sign-up needed.',
        s2h: 'Confirm it', s2p: 'Click the link in the email we send (it may be in your spam folder). Unconfirmed entries are not included in the draw.',
        s3h: 'Win', s3p: 'When time runs out, winners are picked at random and their codes are emailed automatically.',
        rulesTitle: 'Rules and privacy',
        rules: ['One entry per person per giveaway. Entries from the same person using several addresses are disqualified.',

                'Prizes are Microsoft Store codes sent by email and cannot be exchanged for money or other prizes.',
                'Your email is only used for this giveaway, never shared or used for marketing, and is deleted 30 days after the draw.',
                'You can cancel your entry with the “cancel my entry” link in the confirmation email.',
                'Questions: admin@kingpindev.com'],
        months: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
      }
    }[lang];

    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
    document.querySelectorAll('[data-t-html]').forEach(el => { el.innerHTML = T[el.dataset.tHtml]; });
    document.getElementById('rules').innerHTML = T.rules.map(r => '<li>' + esc(r) + '</li>').join('');
    if (lang === 'en') {
      document.title = 'Giveaway · Kingpindev';
      document.querySelector('meta[name="description"]').content = 'Giveaways for Kingpindev apps: enter with your email, and if you win, your Microsoft Store code is emailed to you.';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function when(ts) {
      const d = new Date(ts * 1000);
      const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return lang === 'tr' ? d.getDate() + ' ' + T.months[d.getMonth()] + ' ' + hm : T.months[d.getMonth()] + ' ' + d.getDate() + ', ' + hm;
    }
    function day(ts) { const d = new Date(ts * 1000); return lang === 'tr' ? d.getDate() + ' ' + T.months[d.getMonth()] : T.months[d.getMonth()] + ' ' + d.getDate(); }

    // Banner after the confirmation / cancel links
    const r = new URLSearchParams(location.search).get('r');
    const B = { confirmed: ['', T.confirmed], left: ['', T.left], invalid: ['warn', T.badLink], closed: ['warn', T.closedLink] }[r];
    if (B) document.getElementById('banner').innerHTML = '<div class="banner ' + B[0] + '"><div>' + B[1] + '</div></div>';

    let skew = 0;                        // server clock minus local clock, in seconds
    const timers = [];
    const shownAt = Date.now();

    function countdown(el, target, onDone) {
      const tick = () => {
        let s = Math.max(0, Math.round(target - (Date.now() / 1000 + skew)));
        const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
        el.querySelectorAll('b').forEach((b, i) => { b.textContent = String(v[i]).padStart(2, '0'); });
        if (s <= 0 && onDone) { onDone(); return false; }
        return true;
      };
      tick();
      const id = setInterval(() => { if (!tick()) clearInterval(id); }, 1000);
      timers.push(id);
    }
    const countHtml = label => '<div class="count-label">' + label + '</div><div class="count">' +
      [T.d, T.h, T.m, T.s].map(u => '<div><b>00</b><span>' + u + '</span></div>').join('') + '</div>';

    function links(a) {
      return '<div class="links">' + (a.store ? '<a class="chip" href="' + esc(a.store) + '" target="_blank" rel="noopener">' + T.store + ' ↗</a>' : '') +
        (a.site ? '<a class="chip" href="' + esc(a.site) + (a.site.indexOf('kingpindev.com') > 0 && lang === 'tr' ? 'tr/' : '') + '" target="_blank" rel="noopener">' + T.site + ' ↗</a>' : '') + '</div>';
    }

    function card(g, upcoming) {
      const a = g.app, prize = g.prize[lang] || g.prize.tr, note = g.note[lang] || g.note.tr;
      const el = document.createElement('article');
      el.className = 'gw';
      el.style.setProperty('--c', upcoming ? '#42f8ff' : '#9c7cff');
      el.innerHTML =
        '<div class="gw-l"><div class="gw-app"><img src="' + esc(a.icon || '/img/websitesfavicon.png') + '" alt="">' +
        '<div><span class="state' + (upcoming ? ' soon' : '') + '"><i></i>' + (upcoming ? T.soon : T.live) + '</span><h2>' + esc(a.name) + '</h2></div></div>' +
        '<div class="prize"><b>' + g.winners + '×</b><span>' + esc(prize) + '</span></div>' +
        (note ? '<p class="note">' + esc(note) + '</p>' : '') +
        '<div class="meta"><span>' + T.winners(g.winners) + '</span>' + (upcoming ? '<span>' + T.startsAt(when(g.starts_at)) + '</span>' : '<span>' + T.entries(g.entries) + '</span>') +
        '<span>' + T.endsAt(when(g.ends_at)) + '</span></div>' + links(a) + '</div>' +
        '<div class="gw-r"><div class="cd">' + countHtml(upcoming ? T.countStart : T.countEnd) + '</div>' +
        (upcoming ? '<p class="fine">' + T.fine + '</p>' : g.state === 'ended' ? '<div class="result ok" style="display:block">' + T.drawing + '</div>' :
          '<form class="enter" novalidate><label for="em' + g.id + '">' + T.email + '</label>' +
          '<div class="field"><input id="em' + g.id + '" type="email" name="email" autocomplete="email" inputmode="email" required placeholder="ornek@mail.com">' +
          '<button class="btn" type="submit">' + T.join + '</button></div>' +
          '<div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>' +
          '<div class="spam-note">⚠️<span>' + T.spamNote + '</span></div>' +
          '<p class="fine">' + T.fine + '</p><div class="result" role="status"></div></form>') + '</div>';
      countdown(el.querySelector('.cd'), upcoming ? g.starts_at : g.ends_at, () => setTimeout(load, 2500));
      const form = el.querySelector('form');
      if (form) form.addEventListener('submit', e => { e.preventDefault(); enter(g, form); });
      return el;
    }

    async function enter(g, form) {
      const btn = form.querySelector('.btn'), out = form.querySelector('.result');
      const email = form.email.value.trim();
      out.className = 'result';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) { out.className = 'result err'; out.innerHTML = T.invalid; return; }
      btn.disabled = true; btn.textContent = T.sending;
      try {
        const res = await fetch('/api/giveaway/' + g.id + '/enter', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, lang, website: form.website.value, elapsed: Date.now() - shownAt })
        });
        const j = await res.json().catch(() => ({}));
        if (j.ok && j.status === 'already') { out.className = 'result ok'; out.innerHTML = T.already; }
        else if (j.ok) { out.className = 'result ok'; out.innerHTML = T.sent(esc(email)); form.email.value = ''; }
        else {
          out.className = 'result err';
          out.innerHTML = res.status === 429 ? (j.error === 'slow_down' ? T.slow : T.limit) : j.error === 'invalid_email' ? T.invalid : j.error === 'closed' ? T.closed : T.fail;
        }
      } catch (err) {
        out.className = 'result err'; out.innerHTML = T.fail;
      }
      btn.disabled = false; btn.textContent = T.join;
    }

    async function load() {
      timers.splice(0).forEach(id => { clearInterval(id); clearTimeout(id); });
      const list = document.getElementById('list');
      let d;
      try {
        const res = await fetch('/api/giveaway', { cache: 'no-store' });
        d = await res.json();
      } catch (e) { d = { active: [], upcoming: [], recent: [], now: Date.now() / 1000 }; }
      skew = (d.now || Date.now() / 1000) - Date.now() / 1000;
      list.innerHTML = '';
      d.active.forEach(g => list.appendChild(card(g, false)));
      if (d.active.some(g => g.state === 'ended')) timers.push(setTimeout(load, 15000));   // the server draws within ~20 s
      if (!d.active.length) {
        list.insertAdjacentHTML('beforeend', '<div class="empty"><div class="ico">🎁</div><h2>' + T.emptyT + '</h2><p>' + T.emptyP + '</p>' +
          '<div class="links"><a class="chip" href="https://discord.com/users/349640233651798027" target="_blank" rel="noopener">Discord ↗</a>' +
          '<a class="chip" href="https://www.instagram.com/burakpekeel/" target="_blank" rel="noopener">Instagram ↗</a></div></div>');
      }
      if (d.upcoming.length) {
        list.insertAdjacentHTML('beforeend', '<div class="section-title">' + T.upcomingT + '</div>');
        d.upcoming.forEach(g => list.appendChild(card(g, true)));
      }
      if (d.recent.length) {
        list.insertAdjacentHTML('beforeend', '<div class="section-title">' + T.recentT + '</div>' + d.recent.map(g =>
          '<div class="recent"><img src="' + esc(g.app.icon || '/img/websitesfavicon.png') + '" alt=""><div><b>' + esc(g.app.name) + '</b><br><span>' +
          T.recentLine(g.winners_drawn != null ? g.winners_drawn : g.winners, day(g.drawn_at)) + '</span></div></div>').join(''));
      }
    }
    load();
  })();
  </script>
</body>
</html>
