  <style>
    :root {
      --bg: #030712; --ink: #f8fbff; --soft: #dbe8ff; --muted: #93a4bd; --faint: #56657b;
      --cyan: #42f8ff; --violet: #9c7cff; --pink: #ff65d8; --green: #70ffb2; --amber: #ffc96d; --red: #ff6b8f;
      --glass: rgba(255,255,255,.055); --stroke: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
      font: 16px/1.55 "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: -20vh -10vw auto; height: 90vh; z-index: -1; pointer-events: none;
      background: radial-gradient(40% 50% at 20% 30%, rgba(156,124,255,.22), transparent 70%),
                  radial-gradient(35% 45% at 80% 20%, rgba(66,248,255,.14), transparent 70%),
                  radial-gradient(30% 40% at 60% 70%, rgba(255,101,216,.10), transparent 70%);
    }
    a { color: var(--cyan); }
    .shell { width: min(1080px, 100% - 32px); margin: 0 auto; }

    header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 800; }
    .brand img { width: 36px; height: 36px; border-radius: 11px; }
    .brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }
    .top-r { display: flex; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 38px; padding: 0 14px;
      border-radius: 999px; border: 1px solid var(--stroke); background: var(--glass); color: var(--soft);
      text-decoration: none; font-weight: 700; font-size: 13.5px;
    }
    .chip:hover { border-color: rgba(66,248,255,.45); }

    .hero { padding: 34px 0 10px; text-align: center; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--amber); border: 1px solid rgba(255,201,109,.35); background: rgba(255,201,109,.08);
    }
    .kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.04; letter-spacing: -.035em; margin: 18px 0 12px; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: 17px; }

    .banner {
      margin: 26px auto 0; max-width: 720px; padding: 14px 18px; border-radius: 16px; display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid rgba(112,255,178,.35); background: rgba(112,255,178,.08); color: #d6ffe9; text-align: left;
    }
    .banner.warn { border-color: rgba(255,201,109,.35); background: rgba(255,201,109,.08); color: #ffeccc; }
    .banner b { display: block; }

    main { padding: 30px 0 40px; }
    .gw {
      position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; margin-bottom: 18px;
    }
    .gw::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
      background: radial-gradient(60% 80% at 0% 0%, color-mix(in srgb, var(--c, #9c7cff) 30%, transparent), transparent 70%);
    }
    .gw-l, .gw-r { position: relative; padding: 30px; }
    .gw-r { border-left: 1px solid var(--stroke); background: rgba(3,7,18,.35); }
    .gw-app { display: flex; align-items: center; gap: 16px; }
    .gw-app img { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .gw-app .state { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--green); display: inline-flex; align-items: center; gap: 7px; }
    .gw-app .state i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1.6s ease-in-out infinite; }
    .gw-app .state.soon { color: var(--cyan); }
    @keyframes pulse { 50% { opacity: .35; } }
    .gw-app h2 { margin: 2px 0 0; font-size: 30px; letter-spacing: -.02em; }
    .prize { margin: 22px 0 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .prize b { font-size: 40px; line-height: 1; font-weight: 900; color: var(--amber); }
    .prize span { color: var(--soft); font-weight: 600; font-size: 17px; }
    .note { color: var(--muted); margin: 14px 0 0; white-space: pre-line; }
    .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 14px; }
    .meta b { color: var(--ink); }
    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

    .count-label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 24px; }
    .count div { border-radius: 16px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); padding: 12px 6px; text-align: center; }
    .count b { display: block; font: 800 30px/1.1 "Fira Code", monospace; font-variant-numeric: tabular-nums; }
    .count span { font-size: 11.5px; color: var(--muted); }

    form.enter label { display: block; font-weight: 700; margin-bottom: 8px; }
    .field { display: flex; gap: 8px; }
    .field input {
      flex: 1; min-width: 0; height: 52px; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(3,7,18,.7);
      color: var(--ink); padding: 0 16px; font: inherit;
    }
    .field input:focus { outline: none; border-color: rgba(66,248,255,.6); box-shadow: 0 0 0 4px rgba(66,248,255,.12); }
    .btn {
      height: 52px; padding: 0 22px; border: 0; border-radius: 14px; cursor: pointer; font: 800 15px "Fira Sans", sans-serif; color: #071021;
      background: linear-gradient(135deg, var(--cyan), var(--violet)); box-shadow: 0 10px 30px rgba(156,124,255,.3); white-space: nowrap;
    }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .fine { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
    .spam-note {
      display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 11px 13px; border-radius: 12px; font-size: 13.5px;
      color: #ffeccc; border: 1px solid rgba(255,201,109,.35); background: rgba(255,201,109,.08);
    }
    .spam-note b { color: var(--amber); }
    .result { margin-top: 14px; padding: 13px 15px; border-radius: 14px; font-size: 14.5px; display: none; }
    .result.ok { display: block; border: 1px solid rgba(112,255,178,.35); background: rgba(112,255,178,.08); color: #d6ffe9; }
    .result.err { display: block; border: 1px solid rgba(255,107,143,.4); background: rgba(255,107,143,.08); color: #ffd6e0; }

    .empty {
      text-align: center; padding: 50px 24px; border-radius: 28px; border: 1px dashed var(--stroke); background: rgba(255,255,255,.025);
    }
    .empty .ico { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: rgba(156,124,255,.12); border: 1px solid rgba(156,124,255,.35); font-size: 30px; }
    .empty h2 { margin: 0 0 8px; font-size: 26px; }
    .empty p { color: var(--muted); margin: 0 auto; max-width: 520px; }
    .empty .links { justify-content: center; }

    .section-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
    .recent { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--stroke); background: var(--glass); margin-bottom: 10px; }
    .recent img { width: 44px; height: 44px; border-radius: 13px; }
    .recent span { color: var(--muted); font-size: 14px; }

    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .step { padding: 20px; border-radius: 20px; border: 1px solid var(--stroke); background: var(--glass); }
    .step b { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; margin-bottom: 10px; background: rgba(66,248,255,.1); color: var(--cyan); }
    .step h3 { margin: 0 0 6px; font-size: 17px; }
    .step p { margin: 0; color: var(--muted); font-size: 14.5px; }
    details { margin-top: 12px; border-radius: 18px; border: 1px solid var(--stroke); background: var(--glass); padding: 16px 20px; }
    summary { cursor: pointer; font-weight: 700; }
    details ul { color: var(--muted); margin: 12px 0 0; padding-left: 20px; }
    details li + li { margin-top: 6px; }

    footer { padding: 30px 0 40px; color: var(--faint); font-size: 13.5px; text-align: center; }
    footer a { color: var(--muted); }
    .skeleton { height: 340px; border-radius: 28px; border: 1px solid var(--stroke); background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }

    /* Single giveaway: the app is the hero (its own colours, one-line pitch, big glowing icon, one-row form) */
    .hero.compact { padding: 14px 0 0; }
    .hero.compact h1, .hero.compact .lead, .hero.compact .kicker { display: none; }
    .spot {
      --c1: #9c7cff; --c2: #42f8ff;
      position: relative; overflow: hidden; border-radius: 32px; margin-bottom: 18px;
      display: grid; grid-template-columns: 1.25fr .9fr; align-items: center; gap: 30px; padding: 46px 48px;
      border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent);
      background:
        radial-gradient(60% 90% at 0% 0%, color-mix(in srgb, var(--c1) 26%, transparent), transparent 70%),
        radial-gradient(55% 80% at 100% 100%, color-mix(in srgb, var(--c2) 18%, transparent), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    }
    .spot-k { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
    .spot-k i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s ease-in-out infinite; }
    .spot-k b { color: var(--c1); }
    .spot-eyebrow { margin-top: 22px; color: color-mix(in srgb, var(--c1) 70%, white); font-weight: 700; font-size: 15px; }
    .spot h2 { margin: 4px 0 0; font-size: clamp(44px, 6.2vw, 72px); line-height: .98; letter-spacing: -.04em; }
    .spot-lead { margin: 12px 0 0; font-size: 19px; color: var(--soft); max-width: 520px; }
    .spot-prize { margin: 26px 0 0; display: inline-flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; border-radius: 16px;
      background: rgba(3,7,18,.45); border: 1px solid var(--stroke); font-size: 15px; color: var(--soft); }
    .spot-prize .g { font-size: 22px; }
    .spot-prize b { color: var(--ink); }
    .spot form.enter { margin-top: 22px; max-width: 520px; }
    .spot .field input { background: rgba(3,7,18,.75); }
    .spot .btn { background: linear-gradient(135deg, var(--c2), var(--c1)); box-shadow: 0 10px 30px color-mix(in srgb, var(--c1) 35%, transparent); }
    .spot-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .spot-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 22px; font-size: 14px; color: var(--muted); }
    .spot-meta b { color: var(--ink); font-family: "Fira Code", monospace; font-variant-numeric: tabular-nums; }
    .spot-meta a { color: var(--muted); text-decoration: none; }
    .spot-meta a:hover { color: var(--ink); }
    .spot-art { position: relative; display: grid; place-items: center; aspect-ratio: 1; max-width: 340px; width: 100%; justify-self: center; }
    .spot-art::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; filter: blur(40px); opacity: .55;
      background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c1)); animation: spin 14s linear infinite; }
    .spot-art::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--c1) 40%, transparent); animation: spin 40s linear infinite reverse; }
    .spot-art img { position: relative; width: 64%; aspect-ratio: 1; border-radius: 28%; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); animation: float 6s ease-in-out infinite; }
    .spot-art .tag { position: absolute; z-index: 2; right: 2%; top: 10%; padding: 8px 13px; border-radius: 14px; font-weight: 900; font-size: 15px; color: #1a1206;
      background: linear-gradient(135deg, #ffe8a3, #ffb347); box-shadow: 0 12px 30px rgba(255,179,71,.35); transform: rotate(6deg); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @media (max-width: 820px) {
      .spot { grid-template-columns: 1fr; padding: 28px 22px; gap: 10px; }
      .spot-art { order: -1; max-width: 220px; }
      .spot-k { justify-content: center; width: 100%; }
      .spot-lead { font-size: 17px; }
    }
    /* Several giveaways at once: compact grid, shared notice (and a shared countdown when they all end together) */
    .multi-head { display: grid; grid-template-columns: 1fr auto; gap: 18px 28px; align-items: center; margin-bottom: 16px; padding: 20px 24px; border-radius: 24px; border: 1px solid var(--stroke); background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); }
    .multi-head h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    .multi-head p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
    .multi-head .count { margin: 8px 0 0; min-width: 330px; }
    .multi-head .spam-note { grid-column: 1 / -1; margin: 0; }
    .gw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .mini {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 22px;
      border: 1px solid var(--stroke); background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      transition: border-color .2s ease, transform .2s ease;
    }
    .mini:hover { border-color: rgba(156,124,255,.45); transform: translateY(-2px); }
    .mini::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background: radial-gradient(70% 60% at 0% 0%, rgba(156,124,255,.22), transparent 70%); }
    .mini > * { position: relative; }
    .mini-top { display: flex; align-items: center; gap: 13px; }
    .mini-top img { width: 54px; height: 54px; border-radius: 16px; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
    .mini-top h3 { margin: 1px 0 0; font-size: 21px; letter-spacing: -.01em; }
    .mini-top .state { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
    .mini-top .state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: pulse 1.6s ease-in-out infinite; }
    .mini-prize { display: flex; align-items: baseline; gap: 8px; }
    .mini-prize b { font-size: 26px; line-height: 1; font-weight: 900; color: var(--amber); }
    .mini-prize span { color: var(--soft); font-weight: 600; font-size: 14.5px; }
    .mini-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .mini-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .mini-cd b { font-family: "Fira Code", monospace; }
    .mini form.enter { margin-top: auto; }
    .mini .field { flex-direction: column; gap: 8px; }
    .mini .field input, .mini .btn { flex: none; height: 46px; width: 100%; }
    .mini .result { margin-top: 10px; font-size: 13.5px; }
    .mini-links { display: flex; gap: 14px; font-size: 13px; }
    .mini-links a { color: var(--muted); text-decoration: none; }
    .mini-links a:hover { color: var(--cyan); }
    .multi-fine { text-align: center; margin: 0 0 6px; }
    @media (max-width: 980px) { .gw-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 820px) {
      .multi-head { grid-template-columns: 1fr; padding: 18px; }
      .multi-head .count { min-width: 0; }
    }
    @media (max-width: 620px) { .gw-grid { grid-template-columns: 1fr; } }
    @media (max-width: 820px) {
      .gw { grid-template-columns: 1fr; }
      .gw-r { border-left: 0; border-top: 1px solid var(--stroke); }
      .gw-l, .gw-r { padding: 22px; }
      .steps { grid-template-columns: 1fr; }
      .field { flex-direction: column; }
      .field input { flex: none; width: 100%; }
      .btn { width: 100%; }
      .count b { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>

        return true;

    async function enter(g, form) {
      const btn = form.querySelector('.btn'), out = form.querySelector('.result');
      const email = form.email.value.trim();
      out.className = 'result';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) { out.className = 'result err'; out.innerHTML = T.invalid; return; }
      btn.disabled = true; btn.textContent = T.sending;
      try {
        const res = await fetch('/api/giveaway/' + g.id + '/enter', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, lang, website: form.website.value, elapsed: Date.now() - shownAt })
        });
        const j = await res.json().catch(() => ({}));
        if (j.ok && j.status === 'already') { out.className = 'result ok'; out.innerHTML = T.already; }
        else if (j.ok) { out.className = 'result ok'; out.innerHTML = T.sent(esc(email)); form.email.value = ''; }
        else {
          out.className = 'result err';
          out.innerHTML = res.status === 429 ? (j.error === 'slow_down' ? T.slow : T.limit) : j.error === 'invalid_email' ? T.invalid : j.error === 'closed' ? T.closed : T.fail;
        }
      } catch (err) {
        out.className = 'result err'; out.innerHTML = T.fail;
      }
      btn.disabled = false; btn.textContent = T.join;
    }

      } catch (e) { d = { active: [], upcoming: [], recent: [], now: Date.now() / 1000 }; }
      skew = (d.now || Date.now() / 1000) - Date.now() / 1000;
      list.innerHTML = '';
      document.querySelector('.hero').classList.toggle('compact', d.active.length === 1);
      if (d.active.length > 1) renderMulti(list, d.active);
      else if (d.active.length === 1) list.appendChild(spotlight(d.active[0]));
      if (d.active.some(g => g.state === 'ended')) timers.push(setTimeout(load, 15000));   // the server draws within ~20 s
      if (!d.active.length) {
        list.insertAdjacentHTML('beforeend', '<div class="empty"><div class="ico">🎁</div><h2>' + T.emptyT + '</h2><p>' + T.emptyP + '</p></div>');
      }
      if (d.upcoming.length) {
        list.insertAdjacentHTML('beforeend', '<div class="section-title">' + T.upcomingT + '</div>');
        d.upcoming.forEach(g => list.appendChild(card(g, true)));
      }
      d.recent = d.recent.filter(g => (g.winners_drawn != null ? g.winners_drawn : g.winners) > 0);
      if (d.recent.length) {
        list.insertAdjacentHTML('beforeend', '<div class="section-title">' + T.recentT + '</div>' + d.recent.map(g =>
          '<div class="recent"><img src="' + esc(g.app.icon || '/img/websitesfavicon.png') + '" alt=""><div><b>' + esc(g.app.name) + '</b><br><span>' +
          T.recentLine(g.winners_drawn != null ? g.winners_drawn : g.winners, day(g.drawn_at)) + '</span></div></div>').join(''));
      }
    }
    load();
  })();
  </script>
</body>
</html>
